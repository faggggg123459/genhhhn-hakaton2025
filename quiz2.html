<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Геншин Імпакт | Квіз</title>
    <style>
        /* Загальні стилі */
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(45deg, #4DC4B0, #3AA892, #FFD700, #FF4500);
            background-size: 400% 400%;
            animation: gradientAnimation 10s infinite alternate ease-in-out;
            color: white;
            text-align: center;
        }

        /* Анімація фону */
        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Контейнер квізу */
        .quiz-container {
            max-width: 600px;
            margin: 50px auto;
            background: rgba(0, 0, 0, 0.75);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(255, 215, 0, 0.8);
        }

        /* Таймер */
        .timer {
            font-size: 18px;
            font-weight: bold;
            color: #FF4500;
        }

        /* Варіанти відповідей */
        #options button {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: none;
            background: #444;
            color: white;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        #options button:hover {
            background: #FFD700;
            color: black;
        }

        .correct {
            background: #32CD32 !important;
        }

        .wrong {
            background: #DC143C !important;
        }

        /* Кнопка "Наступне питання" */
        #nextBtn {
            padding: 12px 25px;
            background: #FFD700;
            border: none;
            font-size: 20px;
            color: black;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }

        /* Модальне вікно */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 20px #FFD700;
            text-align: center;
            z-index: 999;
        }

        .modal h2 {
            color: #FFD700;
        }

        .modal-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #FFD700;
            border: none;
            font-size: 18px;
            color: black;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 10px;
            text-decoration: none;
            transition: transform 0.3s ease-in-out;
        }

        .modal-btn:hover {
            transform: scale(1.1);
            background-color: #FF9800;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1 class="fade-in">Квіз про Геншин Імпакт</h1>
        <p class="intro">Перевір свої знання про світ Тейвату!</p>

        <div class="timer">
            <p>⏳ Час: <span id="time-left">30</span> сек</p>
        </div>

        <div class="quiz-box">
            <p id="question"></p>
            <div id="options"></div>
            <button id="nextBtn" onclick="nextQuestion()">Наступне питання</button>
        </div>
    </div>

    <!-- Модальне вікно -->
    <div id="modal" class="modal">
        <h2>🎉 Тест завершено!</h2>
        <p id="finalResult"></p>
        <a href="index.html" class="modal-btn">Повернутися на головний сайт</a>
    </div>

    <script>
        const questions = [
            { question: "Яка стихія належить Венті?", options: ["Гео", "Анемо", "Піро", "Гідро"], correct: 1 },
            { question: "Як називається регіон, яким керує Джонлі?", options: ["Мондштадт", "Інадзума", "Ліюе", "Снєжна"], correct: 2 },
            { question: "Який персонаж є директором похоронного бюро в Ліюе?", options: ["Камісато Аяка", "Ху Тао", "Гань Юй", "Нахіда"], correct: 1 },
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let timeLeft = 30;
        let timerInterval;

        function loadQuestion() {
            clearInterval(timerInterval);
            timeLeft = 30;
            document.getElementById("time-left").textContent = timeLeft;

            const questionEl = document.getElementById("question");
            const optionsEl = document.getElementById("options");

            questionEl.textContent = questions[currentQuestionIndex].question;
            optionsEl.innerHTML = "";

            questions[currentQuestionIndex].options.forEach((option, index) => {
                const btn = document.createElement("button");
                btn.textContent = option;
                btn.onclick = () => checkAnswer(index, btn);
                optionsEl.appendChild(btn);
            });

            document.getElementById("nextBtn").style.display = "none";

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("time-left").textContent = timeLeft;
                if (timeLeft === 0) {
                    clearInterval(timerInterval);
                    nextQuestion();
                }
            }, 1000);
        }

        function checkAnswer(selectedIndex, btn) {
            clearInterval(timerInterval);
            if (selectedIndex === questions[currentQuestionIndex].correct) {
                btn.classList.add("correct");
                score++;
            } else {
                btn.classList.add("wrong");
            }

            document.getElementById("nextBtn").style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;

            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                document.getElementById("modal").style.display = "block";
                document.getElementById("finalResult").textContent = `Твій результат: ${score}/${questions.length}`;
            }
        }

        document.addEventListener("DOMContentLoaded", loadQuestion);
    </script>
</body>
</html>
